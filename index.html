
<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#ffffff">
    
    <title>iVISION - Enterprise Workspace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
            colors: {
              primary: { DEFAULT: '#0061FF', soft: '#EBF2FF', deep: '#0047BD' },
              vibrant: { indigo: '#6366F1', violet: '#8B5CF6', emerald: '#10B981', amber: '#F59E0B', rose: '#F43F5E', sky: '#0EA5E9', orange: '#FF7A00' },
              urgent: '#E11D48',
              success: '#10B981',
              slate: { 50: '#F8FAFC', 100: '#F1F5F9', 200: '#E2E8F0', 400: '#94A3B8', 800: '#1E293B', 900: '#0F172A' }
            },
            borderRadius: { 'xl': '0.75rem', '2xl': '1rem', '3xl': '1.5rem', '4xl': '2rem', '5xl': '2.5rem' }
          }
        }
      }
    </script>
    <style>
      :root {
        --safe-top: env(safe-area-inset-top);
        --safe-bottom: env(safe-area-inset-bottom);
      }
      * { 
        -webkit-font-smoothing: antialiased; 
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
        margin: 0; padding: 0;
      }
      
      html, body {
        height: 100%;
        height: 100dvh; /* Dynamic height for mobile browsers */
        width: 100%;
        background-color: #ffffff;
        color: #0F172A;
        overflow: hidden;
        overscroll-behavior: none;
      }

      #root { 
        height: 100%; 
        width: 100%; 
        display: flex; 
        flex-direction: column; 
      }

      button, a, input, select, textarea {
        touch-action: manipulation;
      }

      .active-scale:active { transform: scale(0.96); opacity: 0.9; }
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

      .modal-drawer {
        animation: modalFadeIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      @keyframes modalFadeIn {
        from { opacity: 0; transform: translateY(30px) scale(0.98); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }

      .glass-card {
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react-router-dom": "https://esm.sh/react-router-dom@^7.11.0",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "recharts": "https://esm.sh/recharts@^3.6.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@^2.89.0"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
