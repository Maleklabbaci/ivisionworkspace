
<!DOCTYPE html>
<html lang="fr" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#020617">
    
    <title>iVISION - Sky Crystal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
            colors: {
              primary: { DEFAULT: '#0EA5E9', soft: '#1E293B', deep: '#0369A1' },
              urgent: '#F43F5E',
              success: '#10B981',
              slate: { 950: '#020617', 900: '#0F172A', 800: '#1E293B' }
            }
          }
        }
      }
    </script>
    <style>
      :root {
        --safe-top: env(safe-area-inset-top);
        --safe-bottom: env(safe-area-inset-bottom);
        --crystal-border: rgba(255, 255, 255, 0.12);
        --crystal-bg: rgba(15, 23, 42, 0.85);
      }
      body {
        background-color: #020617;
        background-image: 
          radial-gradient(circle at 0% 0%, rgba(14, 165, 233, 0.08) 0%, transparent 50%),
          radial-gradient(circle at 100% 100%, rgba(99, 102, 241, 0.08) 0%, transparent 50%),
          linear-gradient(to bottom, #020617, #0f172a);
        color: #f8fafc;
        min-height: 100vh;
        overflow-x: hidden;
        letter-spacing: -0.01em !important;
        -webkit-font-smoothing: antialiased;
      }

      /* CRYSTAL MODULE SYSTEM */
      .crystal-module {
        background: rgba(15, 23, 42, 0.4);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid var(--crystal-border);
        box-shadow: inset 0 0 20px rgba(255, 255, 255, 0.02);
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }

      /* MODAL SYSTEM v7.0 - CRYSTAL SHEETS */
      .modal-overlay {
        position: fixed;
        inset: 0;
        z-index: 100000;
        display: flex;
        justify-content: center;
        align-items: flex-end; /* Bottom on Mobile */
        background: rgba(2, 6, 23, 0.7);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        padding: 0;
        transition: opacity 0.3s ease;
      }

      .modal-container {
        width: 100%;
        max-width: 100%;
        perspective: 1000px;
        will-change: transform;
      }

      .modal-content-glass {
        background: var(--crystal-bg);
        backdrop-filter: blur(40px);
        -webkit-backdrop-filter: blur(40px);
        border: 1px solid var(--crystal-border);
        border-radius: 2.5rem 2.5rem 0 0;
        display: flex;
        flex-direction: column;
        width: 100%;
        max-height: 94vh;
        box-shadow: 0 -20px 80px rgba(0,0,0,0.6), inset 0 1px 1px rgba(255,255,255,0.1);
        overflow: hidden;
      }

      @media (min-width: 768px) {
        .modal-overlay { 
          align-items: center; 
          padding: 2rem; 
        }
        .modal-container { 
          max-width: 720px; 
          transform: translateY(0);
        }
        .modal-content-glass { 
          border-radius: 3.5rem; 
          border: 1px solid rgba(255,255,255,0.15); 
          max-height: 85vh;
        }
        .animate-modal-entry {
          animation: crystalPop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
      }

      @media (max-width: 767px) {
        .animate-modal-entry {
          animation: sheetSlideUp 0.5s cubic-bezier(0.32, 0.72, 0, 1) forwards;
        }
      }

      @keyframes sheetSlideUp {
        from { transform: translateY(100%); }
        to { transform: translateY(0); }
      }

      @keyframes crystalPop {
        from { transform: scale(0.9) translateY(20px); opacity: 0; }
        to { transform: scale(1) translateY(0); opacity: 1; }
      }

      .no-scrollbar::-webkit-scrollbar { display: none; }
      .active-scale:active { transform: scale(0.97); }
      
      .input-iv {
        width: 100%;
        padding: 1.25rem 1.5rem;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 1.5rem;
        color: white;
        font-weight: 600;
        outline: none;
        transition: all 0.2s;
      }
      .input-iv:focus {
        border-color: #0EA5E9;
        background: rgba(14, 165, 233, 0.08);
        box-shadow: 0 0 20px rgba(14, 165, 233, 0.15);
      }
      .label-iv {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        font-size: 0.7rem;
        font-weight: 800;
        color: rgba(255, 255, 255, 0.4);
        text-transform: uppercase;
        margin-bottom: 0.75rem;
        padding-left: 0.75rem;
        letter-spacing: 0.12em;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-router-dom": "https://esm.sh/react-router-dom@^7.12.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "recharts": "https://esm.sh/recharts@^3.6.0",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@^2.90.1"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
