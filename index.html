
<!DOCTYPE html>
<html lang="fr" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#020617">
    
    <title>iVISION - Sky Crystal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
            colors: {
              primary: { DEFAULT: '#0EA5E9', soft: '#1E293B', deep: '#0369A1' },
              urgent: '#F43F5E',
              success: '#10B981',
              slate: { 950: '#020617', 900: '#0F172A', 800: '#1E293B' }
            }
          }
        }
      }
    </script>
    <style>
      :root {
        --safe-top: env(safe-area-inset-top);
        --safe-bottom: env(safe-area-inset-bottom);
      }
      body {
        background-color: #020617;
        background-image: 
          radial-gradient(circle at 0% 0%, rgba(14, 165, 233, 0.1) 0%, transparent 50%),
          radial-gradient(circle at 100% 100%, rgba(99, 102, 241, 0.08) 0%, transparent 50%),
          linear-gradient(135deg, #020617 0%, #0f172a 100%);
        color: #f8fafc;
        min-height: 100vh;
        overflow-x: hidden;
        font-feature-settings: "cv02", "cv03", "cv04", "cv11";
      }
      .glass {
        background: rgba(255, 255, 255, 0.02);
        backdrop-filter: blur(24px) saturate(180%);
        -webkit-backdrop-filter: blur(24px) saturate(180%);
        border: 1px solid rgba(255, 255, 255, 0.05);
      }
      .glass-card {
        background: rgba(15, 23, 42, 0.2);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.04);
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .glass-card:hover {
        background: rgba(255, 255, 255, 0.03);
        border-color: rgba(255, 255, 255, 0.1);
        transform: translateY(-2px);
      }
      .active-scale:active { transform: scale(0.96); }
      .no-scrollbar::-webkit-scrollbar { display: none; }
      
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-fade-in { animation: fadeIn 0.5s cubic-bezier(0.4, 0, 0.2, 1) forwards; }

      .sidebar-item-active {
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
      }

      .modal-overlay {
        position: fixed;
        inset: 0;
        z-index: 10000;
        overflow-y: auto;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 0.75rem;
        background: rgba(2, 6, 23, 0.9);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
      }
      @media (min-width: 768px) {
        .modal-overlay {
          padding: 3rem;
          align-items: center;
        }
      }
      .modal-container {
        width: 100%;
        position: relative;
        margin-top: auto;
        margin-bottom: auto;
      }

      /* Styles spécifique pour l'export PDF via Impression */
      @media print {
        body { background: white !important; color: black !important; }
        aside, nav, header, button, .no-print { display: none !important; }
        main { padding: 0 !important; margin: 0 !important; }
        .max-w-7xl { max-width: 100% !important; }
        .glass, .glass-card { 
          background: white !important; 
          border: 1px solid #eee !important; 
          backdrop-filter: none !important;
          box-shadow: none !important;
          color: black !important;
        }
        .text-white { color: #0f172a !important; }
        .text-slate-500, .text-slate-400 { color: #64748b !important; }
        .bg-slate-950, .bg-slate-900 { background: white !important; }
        .printable-report { display: block !important; padding: 2rem !important; }
        .page-break { page-break-after: always; }
      }
    </style>
    <script type="importmap">
    {
      "imports": {
        "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
        "react-router-dom": "https://esm.sh/react-router-dom@^7.11.0",
        "react/": "https://esm.sh/react@^19.2.3/",
        "react": "https://esm.sh/react@^19.2.3",
        "recharts": "https://esm.sh/recharts@^3.6.0",
        "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
        "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
        "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@^2.89.0"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
