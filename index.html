
<!DOCTYPE html>
<html lang="fr" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#020617">
    
    <title>iVISION - Sky Crystal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
            colors: {
              primary: { DEFAULT: '#0EA5E9', soft: '#1E293B', deep: '#0369A1' },
              urgent: '#F43F5E',
              success: '#10B981',
              slate: { 950: '#020617', 900: '#0F172A', 800: '#1E293B' }
            }
          }
        }
      }
    </script>
    <style>
      :root {
        --safe-top: env(safe-area-inset-top);
        --safe-bottom: env(safe-area-inset-bottom);
      }
      body {
        background-color: #020617;
        background-image: 
          radial-gradient(circle at 0% 0%, rgba(14, 165, 233, 0.1) 0%, transparent 50%),
          radial-gradient(circle at 100% 100%, rgba(99, 102, 241, 0.08) 0%, transparent 50%),
          linear-gradient(135deg, #020617 0%, #0f172a 100%);
        color: #f8fafc;
        min-height: 100vh;
        overflow-x: hidden;
        font-feature-settings: "cv02", "cv03", "cv04", "cv11";
        -webkit-tap-highlight-color: transparent; /* Supprime le flash bleu au clic sur mobile */
      }
      .glass {
        background: rgba(255, 255, 255, 0.02);
        backdrop-filter: blur(24px) saturate(180%);
        -webkit-backdrop-filter: blur(24px) saturate(180%);
        border: 1px solid rgba(255, 255, 255, 0.05);
      }
      .glass-card {
        background: rgba(15, 23, 42, 0.2);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.04);
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }
      @media (hover: hover) {
        .glass-card:hover {
          background: rgba(255, 255, 255, 0.03);
          border-color: rgba(255, 255, 255, 0.1);
          transform: translateY(-2px);
        }
      }
      .active-scale:active { transform: scale(0.94); }
      .no-scrollbar::-webkit-scrollbar { display: none; }
      
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-fade-in { animation: fadeIn 0.4s cubic-bezier(0.4, 0, 0.2, 1) forwards; }

      /* ANTI-CROP MODAL ENGINE v13 */
      .modal-overlay {
        position: fixed;
        inset: 0;
        z-index: 1000000;
        background: rgba(1, 4, 18, 0.95);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        overflow-x: hidden;
        overflow-y: auto; 
        padding: 0.75rem; /* Réduit pour max espace mobile */
        display: flex;
        justify-content: center;
        align-items: center; /* Centrage par défaut */
      }

      .modal-container {
        width: 100%;
        max-width: 500px;
        position: relative;
        z-index: 10;
        pointer-events: auto;
      }

      .modal-content-glass {
        background: rgba(15, 23, 42, 0.8);
        backdrop-filter: blur(40px);
        -webkit-backdrop-filter: blur(40px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 2.5rem;
        padding: 1.75rem;
        box-shadow: 0 0 50px rgba(0, 0, 0, 0.5);
        width: 100%;
        position: relative;
        overflow: hidden;
      }

      @media (max-width: 767px) {
        .modal-overlay {
          align-items: flex-end; /* Style bottom sheet sur mobile */
          padding: 0;
        }
        .modal-container {
          max-width: 100%;
        }
        .modal-content-glass {
          border-radius: 2.5rem 2.5rem 0 0;
          padding-bottom: calc(1.75rem + var(--safe-bottom));
          border-left: 0;
          border-right: 0;
          border-bottom: 0;
        }
        /* Snap horizontal pour Kanban */
        .snap-x {
          scroll-snap-type: x mandatory;
          scroll-behavior: smooth;
        }
        .snap-center {
          scroll-snap-align: center;
        }
      }

      @media (min-width: 768px) {
        .modal-content-glass {
          border-radius: 4rem;
          padding: 4.5rem;
          max-height: 90vh;
          display: flex;
          flex-direction: column;
        }
        .modal-container {
          max-width: 700px;
        }
      }

      body.modal-open {
        overflow: hidden !important;
      }
    </style>
    <script type="importmap">
    {
      "imports": {
        "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
        "react-router-dom": "https://esm.sh/react-router-dom@^7.11.0",
        "react/": "https://esm.sh/react@^19.2.3/",
        "react": "https://esm.sh/react@^19.2.3",
        "recharts": "https://esm.sh/recharts@^3.6.0",
        "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
        "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
        "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@^2.89.0"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
