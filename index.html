<!DOCTYPE html>
<html lang="fr" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#020617">
    
    <title>iVISION - Sky Crystal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
            colors: {
              primary: { DEFAULT: '#0EA5E9', soft: '#1E293B', deep: '#0369A1' },
              urgent: '#F43F5E',
              success: '#10B981',
              slate: { 950: '#020617', 900: '#0F172A', 800: '#1E293B' }
            }
          }
        }
      }
    </script>
    <style>
      :root {
        --safe-top: env(safe-area-inset-top);
        --safe-bottom: env(safe-area-inset-bottom);
        --crystal-border: rgba(255, 255, 255, 0.1);
        --crystal-bg: rgba(30, 41, 59, 0.45);
      }
      body {
        background-color: #020617;
        background-image: 
          radial-gradient(circle at 0% 0%, rgba(14, 165, 233, 0.08) 0%, transparent 50%),
          radial-gradient(circle at 100% 100%, rgba(99, 102, 241, 0.08) 0%, transparent 50%),
          linear-gradient(to bottom, #020617, #0f172a);
        color: #f8fafc;
        min-height: 100vh;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
      }

      .crystal-module {
        background: var(--crystal-bg);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid var(--crystal-border);
        box-shadow: inset 0 0 20px rgba(255, 255, 255, 0.01);
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .modal-overlay {
        position: fixed;
        inset: 0;
        z-index: 100000;
        display: flex;
        justify-content: center;
        align-items: flex-end;
        background: rgba(2, 6, 23, 0.6);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        padding: 0;
        transition: opacity 0.3s ease;
      }

      .modal-container {
        width: 100%;
        max-width: 100%;
        perspective: 1000px;
        will-change: transform;
      }

      .modal-content-glass {
        background: rgba(15, 23, 42, 0.95);
        backdrop-filter: blur(30px);
        -webkit-backdrop-filter: blur(30px);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 2rem 2rem 0 0;
        display: flex;
        flex-direction: column;
        width: 100%;
        max-height: 96vh;
        box-shadow: 0 -10px 50px rgba(0,0,0,0.5);
        overflow: hidden;
      }

      @media (min-width: 768px) {
        .modal-overlay { align-items: center; padding: 2rem; }
        .modal-container { max-width: 720px; }
        .modal-content-glass { border-radius: 3.5rem; max-height: 85vh; }
        .animate-modal-entry { animation: crystalPop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
      }

      @media (max-width: 767px) {
        .animate-modal-entry { animation: sheetSlideUp 0.4s cubic-bezier(0.32, 0.72, 0, 1) forwards; }
      }

      @keyframes sheetSlideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
      @keyframes crystalPop { from { transform: scale(0.9) translateY(20px); opacity: 0; } to { transform: scale(1) translateY(0); opacity: 1; } }

      .no-scrollbar::-webkit-scrollbar { display: none; }
      .active-scale:active { transform: scale(0.96); }
      
      .input-iv {
        width: 100%;
        padding: 1.1rem 1.25rem;
        background: rgba(15, 23, 42, 0.85);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 1.25rem;
        color: white;
        font-weight: 600;
        font-size: 14px;
        outline: none;
        transition: all 0.2s;
        appearance: none;
      }
      
      .input-iv option {
        background-color: #0f172a;
        color: white;
        font-weight: 500;
        padding: 12px;
      }

      .input-iv:focus {
        border-color: #0EA5E9;
        background: rgba(15, 23, 42, 1);
        box-shadow: 0 0 15px rgba(14, 165, 233, 0.15);
      }

      .label-iv {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-size: 0.7rem;
        font-weight: 800;
        color: rgba(255, 255, 255, 0.45);
        text-transform: uppercase;
        margin-bottom: 0.5rem;
        padding-left: 0.5rem;
        letter-spacing: 0.05em;
      }

      .glass {
        background: rgba(255, 255, 255, 0.03);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.05);
      }

      /* Signalétique d'Urgence Active */
      @keyframes urgentGlow {
        0% { border-color: rgba(245, 158, 11, 0.3); box-shadow: 0 0 0 rgba(245, 158, 11, 0); }
        50% { border-color: rgba(245, 158, 11, 1); box-shadow: 0 0 25px rgba(245, 158, 11, 0.4); }
        100% { border-color: rgba(245, 158, 11, 0.3); box-shadow: 0 0 0 rgba(245, 158, 11, 0); }
      }
      .animate-urgent-glow {
        animation: urgentGlow 2s ease-in-out infinite;
        border-width: 2px !important;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-router-dom": "https://esm.sh/react-router-dom@^7.12.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "recharts": "https://esm.sh/recharts@^3.6.0",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@^2.90.1",
    "@google/genai": "https://esm.sh/@google/genai@^1.38.0",
    "react-router": "https://esm.sh/react-router@^7.13.0"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
